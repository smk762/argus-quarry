name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install wheel and smoke-test import
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install dist/*.whl
          uv run --no-sync python -c "from argus_quarry import PortraitRecord, __version__; print(f'argus-quarry {__version__} OK')"

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: test-install
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    runs-on: ubuntu-latest
    # Ordered *after* the TestPyPI rehearsal so its outcome is visible first, but
    # deliberately not gated on it. A TestPyPI-only fault — a missing trusted
    # publisher, an index outage — must not silently withhold the real release:
    # that failure mode shipped argus-proof images for two tags with no wheel on
    # PyPI, and nothing surfaced it because publish-image is independent.
    # Only the build + install gate is required; a TestPyPI failure still marks
    # the whole run failed, so the problem stays loud.
    needs: [test-install, publish-testpypi]
    if: "!cancelled() && needs.test-install.result == 'success'"
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-image:
    runs-on: ubuntu-latest
    needs: test-install
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-quarry
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # The base image has no git, so pass the version in via build-arg
      # (SETUPTOOLS_SCM_PRETEND_VERSION) rather than relying on .git history.
      #
      # Build locally first and smoke-test that the image can actually serve —
      # the 0.2.0 tags shipped without the [server] extra and would have failed
      # here (issue #3). Only then push; the second build is a cache hit.
      - name: Build image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: argus-quarry:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the server
        run: |
          docker run -d --name quarry-smoke -p 8102:8102 argus-quarry:smoke
          # Poll liveness, not readiness: the image ships with no pool, so it is
          # deliberately live-but-not-ready. /health must not depend on the DB or
          # no data-less image could ever publish (issue #10).
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8102/health; then ok=1; break; fi
            sleep 1
          done
          echo
          # And confirm the split holds: an empty pool is correctly unready.
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8102/ready || true)
          docker logs quarry-smoke
          docker rm -f quarry-smoke >/dev/null
          test -n "$ok" || { echo "::error::server did not become live"; exit 1; }
          test "$ready" = "503" || { echo "::error::empty pool should be unready, got $ready"; exit 1; }
      - name: Smoke-test the CLI entrypoint still works
        run: docker run --rm argus-quarry:smoke --help
      - name: Image runs as a non-root user (issue #8)
        run: |
          uid=$(docker run --rm --entrypoint id argus-quarry:smoke -u)
          test "$uid" = "10001" || { echo "::error::image must run as non-root uid 10001, got '$uid'"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # The GitHub Release is the last step, so it only appears once the version is
    # actually installable from PyPI. Its notes are this version's CHANGELOG.md
    # section. Gated on publish-pypi's own result (not the default success()) so a
    # TestPyPI-only fault, which publish-pypi deliberately tolerates, does not
    # also withhold the Release.
    runs-on: ubuntu-latest
    needs: publish-pypi
    if: "!cancelled() && needs.publish-pypi.result == 'success'"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        # Stops at the next version heading or at the link-reference block that
        # closes the file, so the oldest section doesn't carry the link list.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 {found = 1; next} found && /^(## \[|\[[^]]+\]: )/ {exit} found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*|*rc*|*a[0-9]*|*b[0-9]*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh notes and assets rather than failing.
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "$tag" --notes-file notes.md $prerelease
          fi
