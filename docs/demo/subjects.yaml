# Subjects for the hosted demo's recording (scripts/record_tape.py). Same fields as a
# seeds/<category>.yaml file, with the category on each subject.
#
# No identity subjects: the demo shows no photos of real people (issue #22).
# Picked because Commons returns a real mix of licences for them, so the
# recording shows both what quarry lands and what it quarantines.
subjects:
  - name: Kimono
    category: wardrobe
    search: kimono woodblock print ukiyo-e

  - name: Gothic cathedral interior
    category: setting
    search: cathedral interior engraving

  - name: Aurora borealis
    category: concept
    search: aurora borealis northern lights

  - name: Steam locomotive
    category: concept
    search: steam locomotive 1900
